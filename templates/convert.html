<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AI Voice Convert</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="menu-btn" onclick="toggleSidebar()">☰</div>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="sidebar" id="sidebar">
    <div>
        <h2>Deepfake</h2>

        <a href="/home">🏠 Home</a>
        <a href="/record">🎤 Record Audio</a>
        <a href="/convert">🤖 AI Voice Convert</a>
        <a href="/">ℹ️ About</a>
    </div>
</div>

<section class="home">

    <div class="home-container">

        <div class="big-card">

            <h1>Convert Real Audio to AI Voice</h1>

            <p class="home-sub">
                Upload real audio and convert it into AI-generated voice.
            </p>

            <form action="/convert_audio" method="POST" enctype="multipart/form-data" class="upload-area">

                <label class="upload-box">

                    <input type="file" name="audio" accept=".wav">

                    <span>Upload Real Audio (.wav)</span>

                </label>

                <button class="analyze-btn" type="submit">
                    Convert Audio
                </button>

            </form>

            {% if message %}
            <div class="result-section">

                <div class="inner-card">
                    <h2>{{ message }}</h2>

                    <audio controls>
                        <source src="{{ audiopath }}" type="audio/wav">
                    </audio>
                </div>

            </div>
            {% endif %}

        </div>

    </div>

</section>

<script>
function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("active");
    document.getElementById("overlay").classList.toggle("active");
}
</script>

</body>
</html>
