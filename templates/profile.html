<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Deepfake Audio Detection</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>




<body>



    <!-- MENU -->
    <div class="menu-btn" onclick="toggleSidebar()">☰</div>

    <!-- OVERLAY -->
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">

        <div>

            <h2>Deepfake</h2>

            <a href="/home">🏠 Home</a>

            <a href="/record">
                🎤 Record Audio
            </a>

            <a href="/landing">ℹ️ About</a>

            <a href="/logout">🚪 Logout</a>


        </div>

        <div class="sidebar-footer">

            <h2>{{ session.get('user_name') }}</h2>

            <p>Logged In</p>

        </div>

    </div>

    <div class="profile-container">

        <div class="profile-card">

            <div class="profile-header">

                <div class="avatar">
                    <i class="fa-solid fa-user"></i>
                </div>

                <h2>{{ user.name }}</h2>

                <p>{{ user.email }}</p>

            </div>

            <form action="/update_profile" method="POST">

                <input type="text" name="name" value="{{ user.name }}" placeholder="Full Name" required>

                <input type="email" name="email" value="{{ user.email }}" placeholder="Email Address" required>



                <button type="submit">
                    Save Changes
                </button>

            </form>



            <a href="/logout" class="logout-btn">

                Sign Out

            </a>

        </div>

    </div>




    <script>

        function toggleSidebar() {

            document
                .getElementById("sidebar")
                .classList
                .toggle("active");

            document
                .getElementById("overlay")
                .classList
                .toggle("active");
        }

    </script>

</body>

</html>
