<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Deepfake Audio Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<!-- MENU -->
<div class="menu-btn" onclick="toggleSidebar()">☰</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
    <h2>Deepfake</h2>
    <a href="/home">🏠 Home</a>
    <a href="/">ℹ️ About</a>
</div>

<!-- MAIN -->
 <section class="home">

    <div class="big-card">

        <h1 class="main-title">Deepfake Audio Detection</h1>

        <p class="tagline">
            Upload a .wav audio file and get instant detection.
        </p>

        <!-- UPLOAD -->
        <form action="/upload/" method="POST" enctype="multipart/form-data" class="upload-area">

            <label class="upload-box">
                <input type="file" name="audio" accept=".wav" required>
                Click or Drag & Drop Audio (.wav)
            </label>

            <button class="analyze-btn" type="submit">
                {% if result %}Analyze Another Audio{% else %}Analyze{% endif %}
            </button>

        </form>

        <!-- RESULT -->
        {% if result %}

        <!-- RESULT BOX -->
        <div class="inner-card">

            <h2 class="{% if prediction == 'Fake Audio' %}fake{% else %}real{% endif %}">
                {{ prediction }}
            </h2>

            <p><b>Confidence:</b> {{ confidence }}%</p>

            <audio controls>
                <source src="{{ audiopath }}" type="audio/wav">
            </audio>

        </div>

        <!-- INFO BOX -->
        <div class="inner-card info-card">

            <h3>Detection Info</h3>

            <p><b>Analysis:</b></p>
            <p>{{ analysis }}</p>

            <br>

            <p><b>Recommendation:</b></p>
            <p>{{ recommendation }}</p>

        </div>

        {% endif %}

    </div>

</section>
<script>
function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("active");
}
</script>

</body>
</html>
