<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Deepfake Audio Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<!-- MENU -->
<div class="menu-btn" onclick="toggleSidebar()">☰</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
    <div>
        <h2>Deepfake</h2>

        <a href="/home">🏠 Home</a>
        <a href="/record">🎤 Record Audio</a>
        <a href="/">ℹ️ About</a>
    </div>
</div>

<!-- MAIN -->
<section class="home">

    <div class="home-container">

        <div class="big-card">

            <h1>Deepfake Audio Detection</h1>

            <p class="home-sub">
                Upload a .wav audio file and get instant detection.
            </p>

            <!-- UPLOAD -->
            <form action="/upload/" method="POST" enctype="multipart/form-data" class="upload-area">

                <label class="upload-box">
                    <input type="file" name="audio" accept=".wav" required id="fileInput">
                    <span id="fileText">Click or Drag & Drop Audio (.wav)</span>
                </label>

                <button class="analyze-btn" type="submit">Analyze</button>

            </form>

            <!-- RESULT -->
            {% if result %}
            <div class="result-section">

                <!-- RESULT CARD -->
                <div class="inner-card">
                    <h2 class="{% if prediction == 'Fake Audio' %}fake{% else %}real{% endif %}">
                        {{ prediction }}
                    </h2>

                    <p><b>Confidence:</b> {{ confidence }}%</p>

                    <audio controls>
                        <source src="{{ audiopath }}" type="audio/wav">
                    </audio>
                </div>

                <!-- INFO CARD -->
                <div class="inner-card">
                    <h3>Detection Info</h3>

                    <p><b>Analysis:</b> {{ analysis }}</p>
                    <p><b>Recommendation:</b> {{ recommendation }}</p>
                </div>

            </div>
            {% endif %}

        </div>

    </div>

</section>

<!-- SCRIPT -->
<script>
function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("active");
    document.getElementById("overlay").classList.toggle("active");
}

/* FILE NAME SHOW */
const fileInput = document.getElementById("fileInput");
const fileText = document.getElementById("fileText");

fileInput.addEventListener("change", function () {
    if (this.files.length > 0) {
        fileText.textContent = this.files[0].name;
    }
});
</script>

</body>
</html>
